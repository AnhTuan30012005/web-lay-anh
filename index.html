<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zani Portfolio - Admin (visionOS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            /* Apple System Colors */
            --apple-blue: #0A84FF;
            --apple-red: #FF453A;
            --apple-gray: #8E8E93;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            
            /* High-end Glass Properties */
            --glass-bg: rgba(30, 30, 30, 0.35);
            --glass-bg-hover: rgba(50, 50, 50, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            --glass-blur: blur(40px) saturate(180%);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- DYNAMIC MESH BACKGROUND --- 
           Đây là bí quyết để kính trông đẹp. Phải có màu sắc phía sau để kính "bắt" sáng. */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 50vw; height: 50vw; background: #5E5CE6; top: -10%; left: -10%; }
        .orb-2 { width: 40vw; height: 40vw; background: #0A84FF; bottom: -10%; right: -5%; animation-delay: -5s; }
        .orb-3 { width: 45vw; height: 45vw; background: #BF5AF2; top: 40%; left: 30%; animation-delay: -10s; opacity: 0.4; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.9); }
        }

        /* --- THE GLASS MATERIAL --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            /* Bắt sáng cạnh trên kiểu Apple */
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: var(--glass-shadow);
        }

        /* --- WIDGET CARDS (ALBUMS) --- */
        .widget-card {
            background: rgba(40, 40, 40, 0.3);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            cursor: pointer;
        }

        .widget-card:hover {
            transform: scale(1.02) translateY(-5px);
            background: rgba(60, 60, 60, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .widget-image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .widget-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .widget-card:hover .widget-image {
            transform: scale(1.05);
        }

        /* --- IOS INPUTS & SEARCH --- */
        .ios-search-bar {
            background: rgba(118, 118, 128, 0.24) !important;
            border: none !important;
            color: var(--text-primary) !important;
            border-radius: 18px;
            padding: 14px 16px 14px 44px;
            font-size: 17px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .ios-search-bar:focus {
            background: rgba(118, 118, 128, 0.35) !important;
            outline: none;
            box-shadow: inset 0 0 0 2px rgba(10, 132, 255, 0.5);
        }
        .ios-search-bar::placeholder {
            color: var(--text-secondary);
        }
        .search-icon-wrapper {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            z-index: 10;
        }

        /* --- APPLE BUTTONS --- */
        .btn-apple {
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: -0.4px;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-apple:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        
        .btn-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 16px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-row {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .action-row .btn-glass {
            flex: 1;
            text-align: center;
            text-decoration: none;
        }

        /* --- TYPOGRAPHY --- */
        .sf-title {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .sf-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .album-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- OVERLAYS & MODALS --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-body-glass {
            width: 90%;
            max-width: 380px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 32px 24px;
            text-align: center;
        }
        .overlay.active .modal-body-glass {
            transform: scale(1) translateY(0);
        }

        /* --- DYNAMIC ISLAND TOAST --- */
        .dynamic-island {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            z-index: 10000;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dynamic-island.show {
            top: 20px;
        }
        .dynamic-island i {
            color: var(--apple-blue);
            font-size: 18px;
        }

        /* Tinh chỉnh input modal */
        .modal-input {
            background: rgba(0,0,0,0.2) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 17px;
        }
        .modal-input:focus {
            box-shadow: 0 0 0 2px var(--apple-blue);
            outline: none;
        }
    </style>
</head>

<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Màn hình Khóa (FaceID / Login) -->
    <div id="loginOverlay" class="overlay active">
        <div class="glass-panel modal-body-glass">
            <i class="bi bi-person-circle" style="font-size: 60px; color: rgba(255,255,255,0.8); display: block; margin-bottom: 16px;"></i>
            <h4 style="font-weight: 600; margin-bottom: 8px;">Quản trị Portfolio</h4>
            <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 24px;">Nhập mật mã để mở khóa</p>
            
            <input type="password" id="passInput" class="form-control modal-input" placeholder="Mật mã..." style="letter-spacing: 4px;" onkeyup="if(event.key==='Enter') doLogin()">
            <button class="btn-apple w-100" onclick="doLogin()">Mở khóa</button>
            
            <div id="loginErr" style="color: var(--apple-red); font-size: 14px; margin-top: 16px; font-weight: 500; display: none;">
                Mật mã không chính xác
            </div>
        </div>
    </div>

    <!-- Modal Tùy Chỉnh Album -->
    <div id="editModal" class="overlay">
        <div class="glass-panel modal-body-glass" style="text-align: left;" onclick="event.stopPropagation()">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 style="font-weight: 600; margin: 0;">Tùy chỉnh Album</h5>
                <button class="btn-close btn-close-white" style="opacity: 0.5;" onclick="closeEditModal()"></button>
            </div>

            <label class="sf-subtitle mb-2">Tên Album</label>
            <input type="text" id="editName" class="form-control modal-input" style="text-align: left;">

            <label class="sf-subtitle mb-2">Link Ảnh Bìa</label>
            <input type="text" id="editThumb" class="form-control modal-input" style="text-align: left; font-size: 14px;">

            <div class="d-flex gap-2 mt-2">
                <button class="btn-apple flex-grow-1" onclick="saveAlbum()">Xong</button>
                <button class="btn-glass text-danger" style="background: rgba(255, 69, 58, 0.15); border-color: rgba(255, 69, 58, 0.3);" onclick="deleteAlbum()">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Dynamic Island Toast -->
    <div id="toast" class="dynamic-island">
        <i class="bi bi-check-circle-fill" id="toastIcon"></i>
        <span id="toastMsg">Thành công</span>
    </div>

    <!-- Nội dung chính -->
    <div id="mainApp" style="display:none; position: relative; z-index: 1;">
        <div class="container py-5" style="max-width: 1200px;">
            
            <!-- Top Header -->
            <div class="d-flex justify-content-between align-items-end mb-4 px-2">
                <div>
                    <div class="sf-title">Kho Ảnh.</div>
                    <div class="sf-subtitle" id="stAlbums">Đang tải dữ liệu...</div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn-glass" style="border-radius: 50%; width: 44px; height: 44px; padding: 0;" onclick="loadData()">
                        <i class="bi bi-arrow-clockwise" style="font-size: 18px;"></i>
                    </button>
                    <button class="btn-glass" style="border-radius: 50%; width: 44px; height: 44px; padding: 0; color: var(--apple-red);" onclick="doLogout()">
                        <i class="bi bi-power" style="font-size: 18px;"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="position-relative mb-5 px-2">
                <div class="search-icon-wrapper">
                    <i class="bi bi-search"></i>
                </div>
                <input type="text" id="searchInput" class="form-control ios-search-bar" placeholder="Tìm kiếm album, sự kiện..." oninput="renderData()">
            </div>

            <!-- Grid Layout -->
            <div id="gridContainer" class="row g-4 px-2">
                <!-- Data renders here -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbziBHUHWExJRpDh4Y_SSPNtMjl9NPaM80nql9nRwakg3TViR4dXy4EeCD9GS_9nkV1m/exec";
        const VIEW_URL = "https://web-lay-anh.onrender.com/tcController";
        const MY_PASSWORD = "1234";

        let rawData = [];
        let currentEditingRow = null;

        window.onload = function () {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                showApp();
            } else {
                document.getElementById('passInput').focus();
            }
        };

        function doLogin() {
            const input = document.getElementById('passInput');
            if (input.value === MY_PASSWORD) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showApp();
            } else {
                const err = document.getElementById('loginErr');
                err.style.display = 'block';
                input.value = '';
                // Shake effect on the modal body
                const modalBody = document.querySelector('#loginOverlay .modal-body-glass');
                modalBody.style.transform = 'scale(1) translateX(10px)';
                setTimeout(() => modalBody.style.transform = 'scale(1) translateX(-10px)', 100);
                setTimeout(() => modalBody.style.transform = 'scale(1) translateX(0)', 200);
                input.focus();
            }
        }

        function doLogout() {
            if (confirm('Khóa lại Portfolio?')) {
                localStorage.removeItem('isAdminLoggedIn');
                location.reload();
            }
        }

        function showApp() {
            const overlay = document.getElementById('loginOverlay');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadData();
            }, 400);
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').innerText = msg;
            
            if (type === 'error') {
                icon.className = 'bi bi-x-circle-fill text-danger';
            } else {
                icon.className = 'bi bi-check-circle-fill';
                icon.style.color = 'var(--apple-blue)';
            }

            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function loadData() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-light" style="width: 2.5rem; height: 2.5rem; opacity: 0.5;" role="status"></div>
                </div>`;

            fetch(API_URL + "?action=getAdminData")
                .then(res => res.json())
                .then(data => {
                    rawData = data;
                    renderData();
                    showToast("Đã đồng bộ");
                })
                .catch(err => {
                    container.innerHTML = `<div class="col-12 text-center text-danger">Lỗi kết nối iCloud... ý lộn, Google Script!<br>${err.message}</div>`;
                });
        }

        function renderData() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let totalAlbums = 0;

            const filteredList = rawData.filter(item => {
                return String(item.name || '').toLowerCase().includes(searchTerm);
            });

            if (filteredList.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-images" style="font-size: 48px; color: rgba(255,255,255,0.2);"></i>
                        <p class="mt-3 sf-subtitle">Không tìm thấy thư mục nào.</p>
                    </div>`;
                document.getElementById('stAlbums').innerText = `0 Thư mục`;
                return;
            }

            filteredList.forEach(item => {
                totalAlbums++;
                let card = document.createElement('div');
                card.className = 'col-12 col-sm-6 col-lg-4 col-xl-3';
                
                const dateObj = new Date(item.time);
                const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString('vi-VN') : 'Không rõ';

                card.innerHTML = `
                    <div class="widget-card">
                        <div class="widget-image-wrapper">
                            <img src="${item.thumb}" class="widget-image" onerror="this.src='https://placehold.co/400/2c2c2e/86868b?text=Zani+Photo'">
                        </div>
                        <div class="album-title">${item.name || 'Thư mục mới'}</div>
                        <div class="sf-subtitle" style="font-size: 13px; margin-bottom: 16px;">
                            ID: ${item.id} • ${dateStr}
                        </div>
                        
                        <div class="action-row">
                             <a href="${VIEW_URL}?action=view&txtLink=${encodeURIComponent(item.id)}" target="_blank" class="btn-glass">
                                Mở
                             </a>
                             <button class="btn-glass" onclick="openEditModal(${item.rowIndex})">
                                Sửa
                             </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stAlbums').innerText = `${totalAlbums} Thư mục`;
        }

        function openEditModal(rowIndex) {
            currentEditingRow = rowIndex;
            const modal = document.getElementById('editModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);

            const item = rawData.find(r => r.rowIndex === rowIndex);
            if (item) {
                document.getElementById('editName').value = item.name || '';
                document.getElementById('editThumb').value = item.thumb || '';
            }
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 400);
        }

        function saveAlbum() {
            if (!currentEditingRow) return;
            let newName = document.getElementById('editName').value;
            let newThumb = document.getElementById('editThumb').value;

            closeEditModal();
            showToast("Đang lưu...");

            const url = `${API_URL}?action=updateAlbum&rowIndex=${currentEditingRow}&name=${encodeURIComponent(newName)}&thumb=${encodeURIComponent(newThumb)}`;

            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showToast("Đã xong");
                        let row = rawData.find(r => r.rowIndex === currentEditingRow);
                        if (row) { row.name = newName; row.thumb = newThumb; }
                        renderData();
                    } else { showToast("Lỗi máy chủ", "error"); }
                }).catch(() => showToast("Mất kết nối", "error"));
        }

        function deleteAlbum() {
            if (!currentEditingRow) return;
            if (!confirm("Xóa thư mục này vĩnh viễn?")) return;

            closeEditModal();
            showToast("Đang xóa...");

            const url = `${API_URL}?action=deleteAlbum&rowIndex=${currentEditingRow}`;

            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showToast("Đã xóa");
                        rawData = rawData.filter(r => r.rowIndex !== currentEditingRow);
                        renderData();
                    } else { showToast("Lỗi máy chủ", "error"); }
                }).catch(() => showToast("Mất kết nối", "error"));
        }
    </script>
</body>
</html>
