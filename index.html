<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zani Photo Portfolio - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #8b5cf6;
            --secondary-glow: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important;
            border-radius: 12px;
            padding: 12px 15px;
            backdrop-filter: blur(10px);
        }

        .glass-input::placeholder {
            color: #64748b;
        }

        .glass-input:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
            border-color: var(--primary-glow) !important;
        }

        .btn-glow {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-glow:active {
            transform: scale(0.95);
        }

        .btn-danger-glow {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 10px 15px;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-danger-glow:hover {
            background: rgba(239, 68, 68, 0.4);
            color: white;
        }

        .btn-outline-glass {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 0.85rem;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-outline-glass:hover {
            background: white;
            color: black;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
        }

        .card-header-img {
            display: flex;
            padding: 15px;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .thumb-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .action-badge {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: white;
        }

        .action-badge:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: #0f172a;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-glass {
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .blob {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #8b5cf6;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: -1;
        }

        .blob-1 {
            top: -20px;
            left: -20px;
            background: #8b5cf6;
        }

        .blob-2 {
            bottom: -20px;
            right: -20px;
            background: #3b82f6;
        }

        #editModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-glass {
            width: 90%;
            max-width: 380px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .neo-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            z-index: 10001;
            display: none;
            font-weight: 600;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text-neon {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
</head>

<body>

    <!-- Màn hình Đăng nhập -->
    <div id="loginOverlay">
        <div class="glass-box login-glass" id="loginBox">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="mb-4">
                <i class="bi bi-camera-fill text-neon" style="font-size: 3rem;"></i>
            </div>
            <h3 class="fw-bold mb-2">Portfolio Admin</h3>
            <p class="text-muted small mb-4">Vui lòng nhập mật khẩu để quản lý Album</p>

            <input type="password" id="passInput" class="form-control glass-input text-center mb-3" placeholder="••••••"
                onkeyup="if(event.key==='Enter') doLogin()">
            <button class="btn btn-glow w-100" onclick="doLogin()">Truy cập</button>
            <div id="loginErr" class="text-danger fw-bold mt-3 small" style="display:none">Mật khẩu không đúng</div>
        </div>
    </div>

    <div id="mainApp" style="display:none">

        <!-- MODAL CHỈNH SỬA TÊN & ẢNH ĐẠI DIỆN -->
        <div id="editModal">
            <div class="modal-glass" onclick="event.stopPropagation()">
                <div class="p-3 text-center border-bottom border-secondary border-opacity-25">
                    <span class="fw-bold text-neon"><i class="bi bi-gear-fill me-2"></i>TÙY CHỈNH ALBUM</span>
                </div>

                <div class="p-4">
                    <div class="mb-3">
                        <label class="text-muted small mb-1">Tên Album:</label>
                        <input type="text" id="editName" class="form-control glass-input text-white fw-bold">
                    </div>

                    <!-- Form nhập link ảnh mới -->
                    <div class="mb-4">
                        <label class="text-muted small mb-1">Link Ảnh Đại Diện (Thumbnail):</label>
                        <input type="text" id="editThumb" class="form-control glass-input text-white"
                            placeholder="Dán link ảnh vào đây...">
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-glow w-100" onclick="saveAlbum()"><i
                                class="bi bi-floppy-fill me-2"></i>Lưu thay đổi</button>
                        <button class="btn btn-danger-glow w-100" onclick="deleteAlbum()"><i
                                class="bi bi-trash3-fill me-2"></i>Xóa Album này</button>
                        <button class="btn btn-outline-glass w-100 mt-2" onclick="closeEditModal()">Hủy bỏ</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast" class="neo-toast"><i class="bi bi-check-lg"></i> <span id="toastMsg">...</span></div>

        <div class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <div>
                    <h3 class="fw-bold m-0 text-white">Zani Portfolio</h3>
                    <div class="text-muted small">Quản lý kho ảnh cá nhân</div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-glow px-3" onclick="loadData()"><i
                            class="bi bi-arrow-clockwise"></i></button>
                    <button class="btn btn-danger-glow px-3" onclick="doLogout()"><i class="bi bi-power"></i></button>
                </div>
            </div>

            <!-- THỐNG KÊ (Chỉ hiển thị tổng số album) -->
            <div class="row g-3 mb-4 justify-content-center">
                <div class="col-12 col-md-8">
                    <div class="glass-box p-4 h-100 position-relative overflow-hidden text-center">
                        <div class="stat-label mb-1">TỔNG SỐ ALBUM TRONG PORTFOLIO</div>
                        <div class="stat-value text-white" id="stAlbums">0</div>
                        <i class="bi bi-collection position-absolute text-white opacity-25"
                            style="font-size: 5rem; right: 10px; bottom: -10px;"></i>
                    </div>
                </div>
            </div>

            <div class="glass-box p-3 mb-4">
                <div class="position-relative">
                    <i class="bi bi-search position-absolute text-muted" style="left: 15px; top: 14px;"></i>
                    <input type="text" id="searchInput" class="form-control glass-input ps-5 w-100"
                        placeholder="Tìm kiếm tên Album..." oninput="renderData()">
                </div>
            </div>

            <!-- DANH SÁCH ALBUM -->
            <div id="gridContainer" class="row g-3"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbziBHUHWExJRpDh4Y_SSPNtMjl9NPaM80nql9nRwakg3TViR4dXy4EeCD9GS_9nkV1m/exec";
        const VIEW_URL = "https://web-lay-anh.onrender.com/tcController";
        const MY_PASSWORD = "1234";

        let rawData = [];
        let currentEditingRow = null;

        window.onload = function () {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                showApp();
            } else {
                document.getElementById('passInput').focus();
            }
        };

        function doLogin() {
            const input = document.getElementById('passInput');
            if (input.value === MY_PASSWORD) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showApp();
            } else {
                const box = document.getElementById('loginBox');
                document.getElementById('loginErr').style.display = 'block';
                box.classList.add('shake');
                setTimeout(() => box.classList.remove('shake'), 500);
                input.value = '';
                input.focus();
            }
        }

        function doLogout() {
            if (confirm('Đăng xuất khỏi hệ thống?')) {
                localStorage.removeItem('isAdminLoggedIn');
                location.reload();
            }
        }

        function showApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadData();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function loadData() {
            document.getElementById('gridContainer').innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-neon" role="status"></div>
                    <div class="text-muted mt-3 small">Đang tải Portfolio...</div>
                </div>`;

            fetch(API_URL + "?action=getAdminData")
                .then(res => res.json())
                .then(data => {
                    rawData = data;
                    renderData();
                    showToast("Đã cập nhật dữ liệu");
                })
                .catch(err => {
                    document.getElementById('gridContainer').innerHTML = `<div class="col-12 text-center text-danger py-5">Lỗi kết nối API Google Script!<br>${err.message}</div>`;
                });
        }

        function renderData() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let totalAlbums = 0;

            const filteredList = rawData.filter(item => {
                // Thêm hàm String() để ép kiểu dữ liệu về chuỗi văn bản
                return String(item.name || '').toLowerCase().includes(searchTerm);
            });

            if (filteredList.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Không tìm thấy Album nào!</div>';
                document.getElementById('stAlbums').innerText = '0';
                return;
            }

            filteredList.forEach(item => {
                totalAlbums++;

                let card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4 fade-in';
                card.innerHTML = `
                    <div class="order-card">
                        <div class="card-header-img border-0 pb-0">
                            <a href="${VIEW_URL}?action=view&txtLink=${encodeURIComponent(item.id)}" target="_blank">
                                <img src="${item.thumb}" class="thumb-img" onerror="this.src='https://placehold.co/100/1e293b/FFF?text=IMG'">
                            </a>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-bold text-truncate text-white fs-5">${item.name || 'Album không tên'}</div>
                                <div class="small text-muted font-monospace text-truncate">Mã: ${item.id}</div>
                                <div class="text-neon small mt-1"><i class="bi bi-clock"></i> ${new Date(item.time).toLocaleDateString('vi-VN')}</div>
                            </div>
                        </div>
                        
                        <div class="p-3 flex-grow-1"></div> <!-- Thẻ đệm cho đều layout -->

                        <div class="p-3 border-top border-secondary border-opacity-10 bg-dark bg-opacity-25 d-flex justify-content-between align-items-center">
                             <a href="${VIEW_URL}?action=view&txtLink=${encodeURIComponent(item.id)}" target="_blank" class="btn btn-outline-glass">
                                <i class="bi bi-eye-fill me-1"></i> Xem Album
                             </a>
                             <div class="action-badge" onclick="openEditModal(${item.rowIndex})">
                                <i class="bi bi-pencil-square me-1"></i> Tùy chỉnh
                             </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stAlbums').innerText = totalAlbums;
        }

        // --- XỬ LÝ SỬA / XÓA ---
        function openEditModal(rowIndex) {
            currentEditingRow = rowIndex;
            document.getElementById('editModal').style.display = 'flex';

            const item = rawData.find(r => r.rowIndex === rowIndex);
            if (item) {
                document.getElementById('editName').value = item.name || '';
                // Hiện link ảnh hiện tại lên ô input
                document.getElementById('editThumb').value = item.thumb || '';
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // HÀM LƯU TÊN & ẢNH ĐẠI DIỆN MỚI
        function saveAlbum() {
            if (!currentEditingRow) return;

            let newName = document.getElementById('editName').value;
            let newThumb = document.getElementById('editThumb').value;

            closeEditModal();
            showToast("Đang lưu thay đổi...");

            // Gọi API Update (truyền name và thumb)
            const url = `${API_URL}?action=updateAlbum&rowIndex=${currentEditingRow}&name=${encodeURIComponent(newName)}&thumb=${encodeURIComponent(newThumb)}`;

            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showToast("Cập nhật thành công!");
                        let row = rawData.find(r => r.rowIndex === currentEditingRow);
                        if (row) {
                            row.name = newName;
                            row.thumb = newThumb; // Cập nhật lại link ảnh trên UI
                        }
                        renderData();
                    } else {
                        alert("Lỗi server: " + JSON.stringify(data));
                    }
                })
                .catch(err => {
                    alert("Lỗi kết nối!");
                });
        }

        function deleteAlbum() {
            if (!currentEditingRow) return;

            if (!confirm("Bạn có chắc chắn muốn xóa vĩnh viễn Album này không? Dữ liệu sẽ bị xóa khỏi Google Sheet!")) {
                return;
            }

            closeEditModal();
            showToast("Đang xóa Album...");

            const url = `${API_URL}?action=deleteAlbum&rowIndex=${currentEditingRow}`;

            fetch(url, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        showToast("Đã xóa Album!");
                        rawData = rawData.filter(r => r.rowIndex !== currentEditingRow);
                        renderData();
                    } else {
                        alert("Lỗi server: " + JSON.stringify(data));
                    }
                })
                .catch(err => {
                    alert("Lỗi kết nối!");
                });
        }
    </script>
</body>

</html>
