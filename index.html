<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creator Hub Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-glow: #8b5cf6;
            --secondary-glow: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* --- GLASSMORPHISM COMPONENTS --- */
        .glass-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-input, .glass-select {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important;
            border-radius: 12px;
            padding: 12px 15px;
            backdrop-filter: blur(10px);
        }
        .glass-input::placeholder { color: #64748b; }
        .glass-input:focus, .glass-select:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
            border-color: var(--primary-glow) !important;
        }

        /* --- BUTTONS --- */
        .btn-glow {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        .btn-glow:active { transform: scale(0.95); }
        
        .btn-danger-glow {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 10px 15px;
            transition: 0.3s;
        }
        .btn-danger-glow:hover { background: rgba(239, 68, 68, 0.4); color: white; }

        .btn-outline-glass {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn-outline-glass:hover { background: white; color: black; }

        /* --- CARDS --- */
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.07);
        }
        
        .card-header-img {
            display: flex;
            padding: 15px;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .thumb-img {
            width: 70px; height: 70px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .status-badge {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .status-badge:hover { filter: brightness(1.2); transform: scale(1.05); }
        
        .bg-paid { background: linear-gradient(90deg, #10b981, #059669); color: white; }
        .bg-unpaid { background: linear-gradient(90deg, #ef4444, #dc2626); color: white; }
        .bg-free { background: linear-gradient(90deg, #64748b, #475569); color: #cbd5e1; text-decoration: line-through; }

        /* --- LOGIN SCREEN --- */
        #loginOverlay {
            position: fixed; inset: 0; 
            background: #0f172a;
            z-index: 99999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-glass {
            width: 90%; max-width: 380px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        /* Hiệu ứng nền login */
        .blob {
            position: absolute; width: 150px; height: 150px;
            background: #8b5cf6; border-radius: 50%; filter: blur(60px); opacity: 0.6;
            z-index: -1;
        }
        .blob-1 { top: -20px; left: -20px; background: #8b5cf6; }
        .blob-2 { bottom: -20px; right: -20px; background: #3b82f6; }

        /* --- MODAL & TOAST --- */
        #statusModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 10000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-glass {
            width: 85%; max-width: 300px;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from {transform: translateY(50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        
        .modal-option { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: white; font-weight: 500; }
        .modal-option:hover { background: rgba(255,255,255,0.05); }

        .neo-toast {
            position: fixed; top: 20px; right: 20px;
            background: rgba(16, 185, 129, 0.9);
            color: white; padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            z-index: 10001; display: none; font-weight: 600;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(-20px);} to {opacity: 1; transform: translateY(0);} }

        /* Utilities */
        .text-neon { color: #a78bfa; text-shadow: 0 0 10px rgba(167, 139, 250, 0.5); }
        .stat-value { font-size: 1.8rem; font-weight: 700; letter-spacing: -1px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; }

        /* Shake animation */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="glass-box login-glass" id="loginBox">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            
            <div class="mb-4">
                <i class="bi bi-shield-lock-fill text-neon" style="font-size: 3rem;"></i>
            </div>
            <h3 class="fw-bold mb-2">Truy cập Admin</h3>
            <p class="text-muted small mb-4">Vui lòng nhập mật khẩu để quản lý</p>
            
            <input type="password" id="passInput" class="form-control glass-input text-center mb-3" placeholder="••••••" onkeyup="if(event.key==='Enter') doLogin()">
            <button class="btn btn-glow w-100" onclick="doLogin()">Mở khóa</button>
            <div id="loginErr" class="text-danger fw-bold mt-3 small" style="display:none">Mật khẩu không đúng</div>
        </div>
    </div>

    <div id="mainApp" style="display:none">
        
        <!-- <div id="statusModal" onclick="closeStatusModal()">
            <div class="modal-glass" onclick="event.stopPropagation()">
                <div class="p-3 text-center border-bottom border-secondary border-opacity-25">
                    <span class="fw-bold text-neon">CẬP NHẬT TRẠNG THÁI</span>
                </div>
                <div class="modal-option text-success" onclick="confirmUpdate('Đã thanh toán')"><i class="bi bi-check-circle-fill me-2"></i> Đã thanh toán</div>
                <div class="modal-option text-danger" onclick="confirmUpdate('Chưa thanh toán')"><i class="bi bi-exclamation-circle-fill me-2"></i> Chưa thanh toán</div>
                <div class="modal-option text-secondary" onclick="confirmUpdate('Không lấy tiền')"><i class="bi bi-gift-fill me-2"></i> Free (Quà tặng)</div>
                <div class="p-3 text-center text-muted small fw-bold" style="cursor:pointer; background: rgba(0,0,0,0.2)" onclick="closeStatusModal()">HỦY BỎ</div>
            </div>
        </div> -->

        <div id="statusModal">
    <div class="modal-glass" onclick="event.stopPropagation()">
        <div class="p-3 text-center border-bottom border-secondary border-opacity-25">
            <span class="fw-bold text-neon">CẬP NHẬT ĐƠN HÀNG</span>
        </div>
        
        <div class="p-3 border-bottom border-secondary border-opacity-10">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="text-muted small">Số lượng ảnh:</label>
                <div class="text-neon small" style="font-size: 0.7rem;">(10.000đ/tấm)</div>
            </div>
            
            <div class="d-flex gap-2 mb-3">
                <input type="number" id="editQty" class="form-control glass-input text-center text-white fw-bold" 
                       value="0" min="0" oninput="liveCalculate()" onclick="this.select()">
                <span class="d-flex align-items-center text-muted small">tấm</span>
            </div>
            
            <div class="glass-box p-2 d-flex justify-content-between align-items-center" style="background: rgba(0,0,0,0.4)">
                <span class="text-muted small">Thành tiền:</span>
                <span id="previewMoney" class="fw-bold text-success fs-5">0đ</span>
            </div>
        </div>
        <div class="modal-option text-success" onclick="confirmUpdate('Đã thanh toán')">
            <i class="bi bi-check-circle-fill me-2"></i> Xác nhận & Thanh toán
        </div>
        <div class="modal-option text-danger" onclick="confirmUpdate('Chưa thanh toán')">
            <i class="bi bi-exclamation-circle-fill me-2"></i> Lưu số lượng (Chưa trả)
        </div>
        <div class="modal-option text-secondary" onclick="confirmUpdate('Không lấy tiền')">
            <i class="bi bi-gift-fill me-2"></i> Free (Quà tặng)
        </div>
        <div class="p-3 text-center text-muted small fw-bold" style="cursor:pointer; background: rgba(0,0,0,0.2)" onclick="closeStatusModal()">
            HỦY BỎ
        </div>
    </div>
</div>

        <div id="toast" class="neo-toast"><i class="bi bi-check-lg"></i> <span id="toastMsg">...</span></div>

        <div class="container py-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <div>
                    <h3 class="fw-bold m-0 text-white">Dashboard</h3>
                    <div class="text-muted small">Quản lý đơn hàng & doanh thu</div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-glow px-3" onclick="loadData()"><i class="bi bi-arrow-clockwise"></i></button>
                    <button class="btn btn-danger-glow px-3" onclick="doLogout()"><i class="bi bi-power"></i></button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6 col-md-4">
                    <div class="glass-box p-3 h-100 position-relative overflow-hidden">
                        <div class="stat-label mb-1">DOANH THU</div>
                        <div class="stat-value text-success" id="stRev">0đ</div>
                        <i class="bi bi-currency-dollar position-absolute text-success opacity-25" style="font-size: 4rem; right: -10px; bottom: -10px;"></i>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="glass-box p-3 h-100 position-relative overflow-hidden">
                        <div class="stat-label mb-1">SỐ LƯỢNG</div>
                        <div class="stat-value text-white" id="stQty">0</div>
                        <i class="bi bi-image position-absolute text-white opacity-25" style="font-size: 4rem; right: -10px; bottom: -10px;"></i>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="glass-box p-3 h-100 position-relative overflow-hidden">
                        <div class="stat-label mb-1">CHƯA THU</div>
                        <div class="stat-value text-danger" id="stUnpaid">0</div>
                        <i class="bi bi-exclamation-triangle position-absolute text-danger opacity-25" style="font-size: 4rem; right: -10px; bottom: -10px;"></i>
                    </div>
                </div>
            </div>

            <div class="glass-box p-3 mb-4">
                <div class="row g-2">
                    <div class="col-12 col-md-8">
                        <div class="position-relative">
                            <i class="bi bi-search position-absolute text-muted" style="left: 15px; top: 14px;"></i>
                            <input type="text" id="searchInput" class="form-control glass-input ps-5" placeholder="Tìm kiếm tên khách hàng..." oninput="renderData()">
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <select id="filterSelect" class="form-select glass-select" onchange="renderData()">
                            <option value="all">⚡ Tất cả trạng thái</option>
                            <option value="paid">✅ Đã thanh toán</option>
                            <option value="unpaid">⚠️ Chưa thanh toán</option>
                            <option value="free">🎁 Free (Quà tặng)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="gridContainer" class="row g-3"></div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        const API_URL = "https://script.google.com/macros/s/AKfycbziBHUHWExJRpDh4Y_SSPNtMjl9NPaM80nql9nRwakg3TViR4dXy4EeCD9GS_9nkV1m/exec";
        const VIEW_URL = "https://web-lay-anh.onrender.com/tcController";
        const MY_PASSWORD = "1234"; // <--- PASSWORD
        // ----------------

        let rawData = [];
        let currentEditingRow = null;

        // Login Check
        window.onload = function() {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                showApp();
            } else {
                document.getElementById('passInput').focus();
            }
        };

        function doLogin() {
            const input = document.getElementById('passInput');
            if (input.value === MY_PASSWORD) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showApp();
            } else {
                const box = document.getElementById('loginBox');
                document.getElementById('loginErr').style.display = 'block';
                box.classList.add('shake');
                setTimeout(() => box.classList.remove('shake'), 500);
                input.value = '';
                input.focus();
            }
        }

        function doLogout() {
            if(confirm('Đăng xuất khỏi hệ thống?')) {
                localStorage.removeItem('isAdminLoggedIn');
                location.reload();
            }
        }

        function showApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadData();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function loadData() {
            document.getElementById('gridContainer').innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-neon" role="status"></div>
                    <div class="text-muted mt-3 small">Đang đồng bộ dữ liệu...</div>
                </div>`;
            
            fetch(API_URL + "?action=getAdminData")
                .then(res => res.json())
                .then(data => {
                    rawData = data;
                    renderData();
                    showToast("Đã cập nhật dữ liệu");
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('gridContainer').innerHTML = `<div class="col-12 text-center text-danger py-5">Lỗi kết nối!<br>${err.message}</div>`;
                });
        }

        function renderData() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterSelect').value;

            let totalRev = 0, totalQty = 0, totalUnpaid = 0;

            const filteredList = rawData.filter(item => {
                const nameMatch = (item.name || '').toLowerCase().includes(searchTerm);
                let safeStatus = item.status || "Chưa thanh toán";
                let statusMatch = true;
                
                if (filterStatus === 'paid') statusMatch = (safeStatus === 'Đã thanh toán');
                else if (filterStatus === 'unpaid') statusMatch = (safeStatus !== 'Đã thanh toán' && safeStatus !== 'Không lấy tiền');
                else if (filterStatus === 'free') statusMatch = (safeStatus === 'Không lấy tiền');

                return nameMatch && statusMatch;
            });

            if(filteredList.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Không tìm thấy đơn hàng nào!</div>';
                document.getElementById('stRev').innerText = '0đ';
                document.getElementById('stQty').innerText = '0';
                document.getElementById('stUnpaid').innerText = '0';
                return;
            }

            filteredList.forEach(item => {
                let safeStatus = item.status || "Chưa thanh toán";
                let isPaid = safeStatus === 'Đã thanh toán';
                let isFree = safeStatus === 'Không lấy tiền';
                let moneyVal = parseInt(item.money || 0);
                let qtyVal = parseInt(item.qty || 0);

                // LOGIC
                if (!isFree) {
                    totalRev += moneyVal;
                    totalQty += qtyVal;
                    if (!isPaid) totalUnpaid++;
                }

                // Styles
                let badgeClass = 'bg-unpaid';
                let moneyClass = 'text-white';
                let statusText = 'CHƯA THANH TOÁN';
                
                if(isPaid) { 
                    badgeClass = 'bg-paid'; 
                    statusText = 'ĐÃ THANH TOÁN';
                    moneyClass = 'text-success';
                }
                if(isFree) { 
                    badgeClass = 'bg-free'; 
                    statusText = 'KHÔNG LẤY TIỀN';
                    moneyClass = 'text-decoration-line-through text-muted';
                }

                let card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4 fade-in';
                card.innerHTML = `
                    <div class="order-card">
                        <div class="card-header-img">
                            <a href="${VIEW_URL}?action=view&txtLink=${encodeURIComponent(item.id)}" target="_blank">
                                <img src="${item.thumb}" class="thumb-img" onerror="this.src='https://placehold.co/100/1e293b/FFF?text=IMG'">
                            </a>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-bold text-truncate text-white fs-5">${item.name || 'Không có tên'}</div>
                                <div class="small text-muted font-monospace text-truncate">${item.id}</div>
                                <div class="text-neon small mt-1"><i class="bi bi-clock"></i> ${new Date(item.time).toLocaleDateString('vi-VN')}</div>
                            </div>
                        </div>
                        <div class="p-3 flex-grow-1 d-flex flex-column justify-content-center">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="text-muted small fw-bold">SỐ LƯỢNG</span>
                                <span class="fw-bold fs-5 text-white">${qtyVal}</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted small fw-bold">TỔNG TIỀN</span>
                                <span class="fw-bold fs-4 ${moneyClass}">
                                    ${moneyVal.toLocaleString('vi-VN')} đ
                                </span>
                            </div>
                        </div>
                        <div class="p-3 border-top border-secondary border-opacity-10 bg-dark bg-opacity-25 d-flex justify-content-between align-items-center">
                             <a href="${VIEW_URL}?action=view&txtLink=${encodeURIComponent(item.id)}" target="_blank" class="btn btn-outline-glass">
                                <i class="bi bi-eye-fill me-1"></i> Xem ảnh
                             </a>
                             <div class="status-badge ${badgeClass}" onclick="openStatusModal(${item.rowIndex})">
                                ${statusText}
                             </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stRev').innerText = totalRev.toLocaleString('vi-VN') + 'đ';
            document.getElementById('stQty').innerText = totalQty;
            document.getElementById('stUnpaid').innerText = totalUnpaid;
        }

        // --- UPDATE STATUS ---
        // --- LOGIC MỚI: XỬ LÝ SỐ LƯỢNG VÀ TÍNH TIỀN ---
const PRICE_PER_PHOTO = 10000; // Giá 10k/tấm

function openStatusModal(rowIndex) {
    currentEditingRow = rowIndex;
    document.getElementById('statusModal').style.display = 'flex';
    
    // Tìm dữ liệu cũ để điền vào form
    const item = rawData.find(r => r.rowIndex === rowIndex);
    if(item) {
        // Điền số lượng hiện tại (hoặc mặc định là 0 nếu lỗi)
        const currentQty = parseInt(item.qty) || 0;
        document.getElementById('editQty').value = currentQty;
        
        // Gọi hàm tính tiền ngay lập tức để hiển thị đúng số tiền hiện tại
        liveCalculate();
    }
}

function liveCalculate() {
    // Lấy số lượng từ ô nhập
    let qty = parseInt(document.getElementById('editQty').value) || 0;
    
    // Tính tiền: Số lượng * 10.000
    let total = qty * PRICE_PER_PHOTO;
    
    // Hiển thị ra màn hình (định dạng tiền Việt)
    document.getElementById('previewMoney').innerText = total.toLocaleString('vi-VN') + 'đ';
}

function closeStatusModal() {
    document.getElementById('statusModal').style.display = 'none';
}

function confirmUpdate(newStatus) {
    if (!currentEditingRow) return;
    
    // 1. Lấy dữ liệu mới nhất từ ô nhập
    let qtyInput = parseInt(document.getElementById('editQty').value) || 0;
    
    // 2. Tính lại tiền lần cuối để chắc chắn
    let moneyCalculated = qtyInput * PRICE_PER_PHOTO;

    // 3. Nếu chọn Free thì tiền = 0, ngược lại lấy tiền vừa tính
    if (newStatus === 'Không lấy tiền') {
        moneyCalculated = 0;
    }

    closeStatusModal();
    showToast("Đang cập nhật...");

    // 4. Gửi URL kèm theo &qty và &money
    // Lưu ý: Code Google Apps Script của bạn phải đón được 2 tham số này
    const url = `${API_URL}?action=updatePayment&rowIndex=${currentEditingRow}&status=${encodeURIComponent(newStatus)}&qty=${qtyInput}&money=${moneyCalculated}`;
    
    fetch(url, { method: 'GET', redirect: 'follow' })
    .then(res => res.json())
    .then(data => {
        if (data.status === "updated") {
            showToast("Cập nhật thành công!");
            
            // Cập nhật ngay trên giao diện (Client side) để không cần F5
            let row = rawData.find(r => r.rowIndex === currentEditingRow);
            if(row) {
                row.status = newStatus;
                row.qty = qtyInput;        // Cập nhật số lượng mới hiển thị
                row.money = moneyCalculated; // Cập nhật tiền mới hiển thị
            }
            renderData(); // Vẽ lại các thẻ
        } else {
            alert("Lỗi server: " + JSON.stringify(data));
        }
    })
    .catch(err => {
        console.error(err);
        alert("Lỗi kết nối!");
    });
}
    </script>
</body>
</html>
